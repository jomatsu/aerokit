included:
  - packages

excluded:
  - .build
  - packages/*/.build
  # Non-production scaffolding used only to record README demo media; another
  # effort is mid-refactor here. Re-enable linting once that work settles.

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_assert
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_name
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo
  # Modifier ordering and brace placement are owned by SwiftFormat (its
  # modifierOrder and wrapMultilineStatementBraces rules); SwiftLint's
  # equivalents disagree on `nonisolated` order and multiline-statement
  # braces, so defer both to the formatter to avoid the tools fighting.
  - modifier_order
  - opening_brace

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

file_name:
  # A custom `excluded` replaces the rule's defaults, so the entry-point names
  # it normally skips (main.swift, LinuxMain.swift) must be restored here.
  # WorkspaceCardStyle.swift deliberately groups the shared workspace-card
  # style primitives (metrics, the panel modifier, the thumbnail) under one
  # name rather than a single type, so it cannot match a declared type.
  excluded:
    - main.swift
    - LinuxMain.swift
    - WorkspaceCardStyle.swift

# Feature controllers and SwiftUI views here are cohesive despite their
# length; raised so the Exposé controller (472) sits under the warning while
# the hard cap still catches genuinely runaway types.
type_body_length:
  warning: 500
  error: 600

# SwiftUI-heavy view and controller files run long by nature; the warning is
# relaxed but the hard cap is kept to flag files that have truly sprawled.
file_length:
  warning: 700
  error: 800

function_body_length:
  warning: 60
  error: 100

closure_body_length:
  warning: 40
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 16

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_function_declarations: true

reporter: "xcode"
